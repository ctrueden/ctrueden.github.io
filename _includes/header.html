<aside>
	<div class="container">
		<nav>
			<ul>
				{% assign nav_pages = site.pages | where_exp: "page", "page.nav" | sort: "nav_order" %}
				{% for page in nav_pages %}
				<li><a href="{{ page.url | prepend: site.baseurl }}">{{ page.nav }}</a></li>
				{% endfor %}
			</ul>
		</nav>
	</div>
</aside>

<header>
	<div>
		<h1>{{ page.title }}</h1>
	</div>
</header>
